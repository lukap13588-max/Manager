<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#091a2a"><title>Kirchdorf Mangei 2.0 – Version 1.0</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf3f9;background:#081522}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 13px;background:#1c3950;color:#f3fbff}button:hover{background:#29536c}button.primary{background:#18a6a1;color:#052027;font-weight:750}button:disabled{opacity:.4;cursor:not-allowed}header{padding:20px 18px;background:linear-gradient(125deg,#102b41,#075c65);border-bottom:1px solid #366174}header h1{margin:0;font-size:24px}header small{color:#b6d5dc}main{max-width:1180px;margin:auto;padding:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.panel{background:#102438;border:1px solid #284356;border-radius:14px;padding:15px}.stat span{display:block;color:#a5bac8;font-size:12px}.stat strong{font-size:23px}nav{display:flex;gap:7px;overflow-x:auto;margin:16px 0;padding:4px 0 9px;scrollbar-width:thin;scroll-snap-type:x proximity}nav button{flex:0 0 auto;white-space:nowrap;scroll-snap-align:start}nav button.active{background:#1a8c91;color:white}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.panel{margin-bottom:13px}h2{margin:0 0 12px;font-size:19px}h3{margin:13px 0 8px;font-size:15px}p{line-height:1.5;color:#c8d9e4}.muted{color:#9fb6c6;font-size:13px}.line{border-top:1px solid #2a4559;padding:11px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}.line:first-of-type{border:0}.line small{display:block;color:#a8becd}.pill{border-radius:20px;background:#234456;padding:4px 9px;font-size:12px;white-space:nowrap}.good{color:#61d9ae}.bad{color:#ffac9c}input,select{background:#081a2b;border:1px solid #456074;border-radius:9px;padding:10px;color:white;width:100%;margin:5px 0 10px}label{display:block;color:#bad0df;font-size:13px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #284357;padding:9px 5px;text-align:left}th{color:#9db8c9}td:last-child,th:last-child{text-align:right}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{border-left:3px solid #21b5ae;padding:9px 12px;background:#173447;margin:8px 0}.log{max-height:350px;overflow:auto}.log p{border-bottom:1px solid #294355;padding-bottom:9px;font-size:13px}.overlay{position:fixed;inset:0;background:#020910db;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.modal{background:#122b40;border:1px solid #426074;border-radius:17px;max-width:550px;width:100%;padding:23px;max-height:90vh;overflow:auto}.modal h2{font-size:22px}.hidden{display:none!important}.bar{height:8px;background:#2a4557;border-radius:20px;overflow:hidden}.bar>i{display:block;background:#21b6a4;height:100%}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}header h1{font-size:21px}main{padding:10px}.stat strong{font-size:20px}button{min-height:44px}.line{flex-wrap:wrap}td{word-break:normal}nav{margin:10px 0}} </style></head><body>
<header><div style="max-width:1180px;margin:auto"><small>🏒 EISHOCKEY VEREINSMANAGER · VERSION 1.0</small><h1>KIRCHDORF MANGEI</h1><small>Gründe deinen Verein. Verhandle selbst. Baue eine Mannschaft auf.</small></div></header>
<main><div class="stats" id="stats"></div><nav id="nav"></nav><div id="content"></div></main><div class="overlay hidden" id="overlay"><div class="modal" id="modal"></div></div>
<script>
"use strict";
const $=x=>document.getElementById(x), euro=n=>Math.round(n).toLocaleString('de-AT')+' €';
const first=['Florian','Matthias','Tobias','Stefan','Lukas','Daniel','Patrick','Simon','Andreas','Markus','Christoph','David','Michael','Thomas','Fabian','Kevin','Jonas','Dominik','Sebastian','Martin','Alexander','Philipp','Benjamin','Julian','Raphael','Felix'];
const last=['Huber','Gruber','Fuchs','Aigner','Berger','Moser','Hofer','Eder','Leitner','Wallner','Egger','Kofler','Pletzer','Wimmer','Höller','Riedl','Klausner','Schwaiger','Hauser','Obermoser'];
const rivals=['St. Johann Falken','Kitzbühel Nord','Fieberbrunn Wolves','Waidring Ice','Kössen Tigers','Saalfelden Rockets','Pillersee Hawks'];
const sponsors=['Tirol Metalltechnik','Autohaus Piller','Kitzbüheler Bergsport','Versicherungsbüro Leitner','Gasthof Alpenblick','Sporthaus Tirol','Bauunternehmen Hofer','Raiffeisen Partner'];
let S=null, tab='Übersicht', seq=0;
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, pick=a=>a[rand(0,a.length-1)];
const freshPlayer=(pos)=>({id:++seq,name:pick(first)+' '+pick(last),age:rand(18,37),pos:pos||pick(['TW','V','V','S','S','S']),skill:rand(48,76),morale:rand(55,80),fitness:100,wage:rand(0,2)===0?0:rand(20,90),status:'Interessent'});
function init(budget=5000){seq=0;S={week:1,cash:budget,starting:budget,players:[],candidates:[],sponsors:[],offers:[],arena:{level:0,ice:0,price:160,venue:'St. Johann',talked:false,proposal:false},municipality:{trust:15,submitted:false,grant:0,asked:false},fan:15,chem:30,training:0,fixtures:[],played:[],opponents:rivals.map(name=>({name,power:rand(53,72),points:0})),ledger:[{week:1,title:'Gründungskapital',amount:budget}],logs:['Woche 1: Die Kirchdorf Mangei wurden gegründet. Alle Entscheidungen liegen bei dir.'],pending:[],requests:[],contracts:[],homeOffer:null,season:1,injuries:[],actions:0,league:null,scorers:{},matchReports:[]};save();render()}
function save(){localStorage.setItem('mangei_v1',JSON.stringify(S))}
function load(){try{const s=JSON.parse(localStorage.getItem('mangei_v1'));if(s){S=s;seq=nextSequence(s);migrateSave();return true}}catch(e){}return false}
function nextSequence(state){let all=[...(state.players||[]),...(state.candidates||[]),...(state.staff||[]),...(state.staffCandidates||[]),...(state.transferMarket||[]),...(state.fixtures||[]),...(state.youth?.players||[])];return Math.max(0,...all.map(x=>Number(x.id)||0));}
function migrateSave(){if(!S)return;S.players ||= [];S.candidates ||= [];S.sponsors ||= [];S.requests ||= [];S.pending ||= [];S.fixtures ||= [];S.played ||= [];S.logs ||= [];S.ledger ||= [];S.opponents ||= rivals.map(name=>({name,power:rand(53,72)}));S.municipality ||= {trust:15,submitted:false,grant:0,asked:false};S.arena ||= {level:0,ice:0,price:160,venue:'St. Johann',talked:false,proposal:false};S.fan ??= 15;S.chem ??= 30;S.training ??= 0;S.season ??= 1;S.week ??= 1;S.cash ??= 0;S.scorers ||= {};S.matchReports ||= [];S.detailedReports ||= [];ensureCareers();ensureDevelopment();ensureTactics();ensureLeagueFields();ensureWorld();ensureArenaProject();for(let x of S.sponsors){x.paid ??= 0;x.first ??= Math.round(x.total*.6);x.second ??= x.total-x.first;x.firstWeek ??= (x.signed||S.week)+1;x.secondWeek ??= (x.signed||S.week)+9;x.firstPaid ??= x.paid>=x.first;x.secondPaid ??= x.paid>=x.total;} }
function log(x){S.logs.unshift('Woche '+S.week+': '+x);S.logs=S.logs.slice(0,90)}
function cash(n,title){if(n<0&&S.cash+n<0){msg('Nicht genug Geld','Diese Ausgabe würde die Vereinskasse überziehen.');return false}S.cash+=n;S.ledger.unshift({week:S.week,title,amount:n});return true}
function msg(title,body,buttons=[['Schließen',()=>close()]]){$('overlay').classList.remove('hidden');$('modal').innerHTML='<h2>'+title+'</h2><div id="mbody">'+body+'</div><div class="actions" id="mbtns"></div>';buttons.forEach(([name,fn])=>{let b=document.createElement('button');b.textContent=name;b.onclick=fn;$('mbtns').appendChild(b)})}
function close(){$('overlay').classList.add('hidden');render()}
function confirmAction(title,description,yes){msg(title,'<p>'+description+'</p>',[['Bestätigen',()=>{close();yes();save();render()}],['Abbrechen',close]])}
function addRequest(type,label,payload){S.requests.push({id:rand(10000,99999),type,label,payload,ready:S.week+rand(1,2)});log(label+' – Anfrage versendet. Rückmeldung ausstehend.')}
function act(name,fn){fn();S.actions++;save();render()}
function bar(n){return '<div class="bar"><i style="width:'+Math.max(0,Math.min(100,n))+'%"></i></div>'}
const card=(title,body)=>'<section class="panel"><h2>'+title+'</h2>'+body+'</section>';
const btn=(label,action,disabled=false)=>'<button '+(disabled?'disabled':'')+' onclick="'+action+'">'+label+'</button>';
const tabs=['Übersicht','Mannschaft','Gespräche','Sponsoren','Gemeinde','Eis & Arena','Spielbetrieb','Taktik & Aufstellung','Personal & Nachwuchs','Vereinswelt','Finanzen'];
function render(){if(!S){$('stats').innerHTML='';$('nav').innerHTML='';$('content').innerHTML=card('Neues Spiel','<p>Du startest als Präsident eines neu gegründeten Tiroler Hobby-Eishockeyvereins. Keine automatischen Vereinsentscheidungen.</p><label>Startkapital</label><select id="budget"><option value="5000">5.000 €</option><option value="12000">12.000 €</option><option value="25000">25.000 €</option><option value="0">0 €</option></select>'+btn('Neues Spiel beginnen','init(+document.getElementById("budget").value)'));return}
$('stats').innerHTML=[['Kasse',euro(S.cash)],['Woche',S.week],['Kader',S.players.length+'/16'],['Fans',S.fan]].map(([a,b])=>'<div class="stat"><span>'+a+'</span><strong>'+b+'</strong></div>').join('');
$('nav').innerHTML=tabs.map(t=>'<button class="'+(tab===t?'active':'')+'" onclick="tab=\''+t+'\';render()">'+t+'</button>').join('');
const pages={'Übersicht':overview,'Mannschaft':team,'Gespräche':talks,'Sponsoren':sponsorsPage,'Gemeinde':municipality,'Eis & Arena':arenaPage,'Spielbetrieb':games,'Taktik & Aufstellung':tacticsPage,'Personal & Nachwuchs':clubDevelopment,'Vereinswelt':worldPage,'Finanzen':finance};
$('content').innerHTML=pages[tab]();}
function overview(){migrateSave();const due=S.requests.filter(r=>r.ready<=S.week).length;const warnings=[];if(S.cash<1000)warnings.push('Geringe Liquidität: '+euro(S.cash));if(S.players.length<12)warnings.push('Kader noch nicht ligatauglich: '+S.players.length+'/12 Spieler');if(!S.players.some(p=>p.pos==='TW'))warnings.push('Kein Torhüter im Kader');if(S.players.some(p=>p.contractUntil-S.week<=4))warnings.push('Mindestens ein Vertrag läuft innerhalb von vier Wochen aus');if(S.fixtures.some(f=>f.home&&!f.icePaid&&f.week<=S.week+2&&!(S.arenaProject?.stage===5&&S.arenaProject?.matchOperationsApproved)))warnings.push('Heimspiel-Eiszeit für ein nahes Spiel nicht gebucht');return '<div class="grid"><div>'+card('Vereinszentrale','<p>Deine Entscheidungen steuern den Verein. Jede Woche entwickeln sich Anfragen, Sponsoren und die Liga weiter. Es werden keine Spieler verpflichtet, Ausgaben ausgelöst oder Verträge unterschrieben, ohne dass du zustimmst.</p><div class="notice">'+(S.pending.length?S.pending.length+' neue Angebote oder Rückmeldungen warten auf dich.':'Noch keine offenen Entscheidungen aus Rückmeldungen.')+'</div><div class="actions">'+btn('Nächste Woche simulieren','nextWeek()',false)+btn('Offene Rückmeldungen','tab="Gespräche";render()')+'</div><p class="muted">Beim Wochenwechsel können Spielresultate, Spielerverletzungen und bereits vereinbarte Zahlungseingänge entstehen. Neue Maßnahmen benötigen deine Freigabe.</p>')+card('Vorstandswarnungen',warnings.length?warnings.map(x=>'<div class="line"><span>⚠ '+x+'</span></div>').join(''):'<p class="muted">Keine akuten Warnungen.</p>')+card('Aktuelle Ziele','<div class="line">16 Spieler aufbauen <span>'+S.players.length+'/16</span></div>'+bar(S.players.length/16*100)+'<div class="line">Eiszeiten <span>'+S.arena.ice+' Stunden verfügbar</span></div><div class="line">Sponsorengelder <span>'+euro(S.sponsors.reduce((a,x)=>a+x.total,0))+' Verträge</span></div><div class="line">Gemeindevertrauen <span>'+S.municipality.trust+'/100</span></div>'+bar(S.municipality.trust))+'</div><div>'+card('Neuigkeiten','<div class="log">'+S.logs.slice(0,10).map(x=>'<p>'+x+'</p>').join('')+'</div>')+card('Verwaltung','<div class="actions">'+btn('Spielstand exportieren','exportSave()')+btn('Spielstand importieren','importSave()')+btn('Neues Spiel','resetGame()')+'</div><p class="muted">Speicherung automatisch auf diesem Gerät im Browser. Export sichert den Spielstand zusätzlich als Datei.</p>')+'</div></div>'}
function team(){ensureCareers();return card('Mannschaft · '+S.players.length+' Spieler','<p>Spieler haben Stärken, Fitness, Moral und individuelle Erwartungen. Ein Interessent wird nur durch deine Zustimmung aufgenommen.</p><div class="actions">'+btn('Öffentliche Spielersuche (0 €)','recruit()')+btn('Training durchführen','train()',S.arena.ice<1||!S.players.length)+'</div><h3>Aktiver Kader</h3><table><tr><th>Name</th><th>Pos.</th><th>Stärke</th><th>Fitness</th><th></th></tr>'+S.players.map(p=>'<tr><td>'+p.name+'<small> · '+p.age+' J.</small></td><td>'+p.pos+'</td><td>'+p.skill+'</td><td>'+p.fitness+'%</td><td>'+btn('Details','playerDetail('+p.id+')')+'</td></tr>').join('')+'</table><h3>Interessenten ('+S.candidates.length+')</h3>'+S.candidates.map(p=>'<div class="line"><div><b>'+p.name+'</b><small>'+p.pos+' · Stärke '+p.skill+' · Erwartung '+euro(p.wage)+'/Saison</small></div>'+btn('Gespräch','candidateTalk('+p.id+')')+'</div>').join('')+(!S.candidates.length?'<p class="muted">Noch keine Bewerbungen. Starte eine Spielersuche.</p>':''))}
function recruit(){act('Suche',()=>{const n=rand(4,8);for(let i=0;i<n;i++)S.candidates.push(freshPlayer());log('Öffentliche Spielersuche bringt '+n+' Interessenten. Gespräche sind möglich.')})}
function candidateTalk(id){
let p=S.candidates.find(x=>x.id===id);if(!p)return;
dialogue('Spielergespräch: '+p.name,'„Servus! Ich habe gehört, ihr baut eine neue Mannschaft auf. Was habt ihr vor?“',[
['Wir wollen langfristig einen starken Verein aufbauen.',()=>{p.morale=Math.min(100,p.morale+8);p.wage=Math.max(0,p.wage-10);log('Mit '+p.name+' über die langfristige Vereinsvision gesprochen.');playerOffer(p,'„Das klingt gut. Wenn ihr es ernst meint, bin ich interessiert.“')}],
['Wir bieten dir regelmäßiges Training und faire Chancen.',()=>{p.morale=Math.min(100,p.morale+5);playerOffer(p,'„Regelmäßige Eiszeit ist mir wichtig. Über eine Aufnahme können wir reden.“')}],
['Wir haben wenig Budget. Würdest du kostenlos spielen?',()=>{if(Math.random()<.45){p.wage=0;playerOffer(p,'„Für den Anfang mache ich es ehrenamtlich, wenn es wirklich organisiert ist.“')}else{p.morale=Math.max(0,p.morale-10);playerOffer(p,'„Ganz ohne Aufwandsersatz ist schwierig. Ich bleibe bei meinen Vorstellungen.“')}}],
['Gespräch vertagen',()=>{log('Gespräch mit '+p.name+' vertagt.');close();save()}]
]);}
function dialogue(title,statement,options){msg(title,'<p class="notice">'+statement+'</p>',options.map(([label,fn])=>[label,fn]));}
function playerOffer(p,reply){save();dialogue('Antwort: '+p.name,reply+'<br>Aktuelle Saisonforderung: '+euro(p.wage),[
['Aufnahme verbindlich bestätigen',()=>{if(S.players.length>=30){msg('Kader voll','Maximal 30 Spieler.');return}if(!cash(-p.wage,'Spieleraufwand: '+p.name))return;S.players.push({...p,status:'Aktiv',contractUntil:S.week+26,injuredUntil:0,potential:Math.max(p.skill,rand(60,92)),careerGoal:pick(['Stammplatz','Sportliche Entwicklung','Mehr Eiszeit','Aufstieg'])});S.candidates=S.candidates.filter(x=>x.id!==p.id);S.chem=Math.min(100,S.chem+1);log(p.name+' ist dem Kader beigetreten.');close();save()}],
['Noch nicht entscheiden',()=>{log('Aufnahme von '+p.name+' bleibt offen.');close();save()}]
]);}
function playerDetail(id){ensureCareers();let p=S.players.find(x=>x.id===id);if(!p)return;let injury=p.injuredUntil>S.week?'Verletzt bis Woche '+p.injuredUntil:'Einsatzfähig';let contract='Vertrag bis Woche '+p.contractUntil;msg(p.name,'<p>'+p.pos+' · '+p.age+' Jahre · Stärke '+p.skill+' · Moral '+p.morale+' · Fitness '+p.fitness+'%</p><p>'+contract+' · '+injury+'</p><p>Karriereziele: '+p.careerGoal+'</p><p>Potenzial: '+p.potential+'</p>',[['Vertrag um 20 Wochen verlängern','renewPlayer('+id+')'],['Spieler freigeben','releasePlayer('+id+')'],['Schließen',close]])}
function renewPlayer(id){let p=S.players.find(x=>x.id===id);if(!p)return;let amount=Math.max(0,Math.round(p.wage*.75));confirmAction('Vertrag verlängern','20 zusätzliche Wochen für '+euro(amount)+' Aufwandsersatz. Nur bei deiner Zustimmung wird der Vertrag verlängert.',()=>{if(!cash(-amount,'Verlängerung '+p.name))return;p.contractUntil=Math.max(p.contractUntil,S.week)+20;p.morale=Math.min(100,p.morale+6);log(p.name+' verlängert bis Woche '+p.contractUntil+'.');save()})}
function releasePlayer(id){let p=S.players.find(x=>x.id===id);if(!p)return;confirmAction('Spieler freigeben','Den Spieler '+p.name+' ohne Ablöse aus dem Kader entlassen? Diese Entscheidung ist endgültig.',()=>{S.players=S.players.filter(x=>x.id!==id);log(p.name+' verlässt den Verein.');save()})}
function train(){confirmAction('Training durchführen','Eine bereits bezahlte Eisstunde wird verbraucht. Training verbessert Abstimmung, belastet aber die Fitness. Kein zusätzlicher Mietpreis.',()=>act('Training',()=>{S.arena.ice--;S.training++;S.chem=Math.min(100,S.chem+rand(2,5));S.players.forEach(p=>{p.fitness=Math.max(55,p.fitness-rand(3,9));if(Math.random()<.14)p.skill=Math.min(95,p.skill+1)});log('Mannschaftstraining absolviert. Teamchemie steigt auf '+S.chem+'.')}))}
function talks(){return card('Posteingang & Verhandlungen','<p>Hier erscheinen eingegangene Angebote, Gesprächsreaktionen und Rückfragen. Keine Antwort wird automatisch angenommen.</p>'+S.pending.map((p,i)=>'<div class="line"><div><b>'+p.title+'</b><small>'+p.desc+'</small></div>'+btn('Öffnen','openPending('+i+')')+'</div>').join('')+(!S.pending.length?'<p class="muted">Keine neuen Rückmeldungen.</p>':'')+'<h3>Ausstehende Anfragen</h3>'+S.requests.map(x=>'<div class="line">'+x.label+'<span class="pill">Erwartet ab Woche '+x.ready+'</span></div>').join(''))}
function openPending(i){let p=S.pending[i];if(!p)return;let opts=[['Später',close]];if(p.kind==='ice')opts.unshift(['Buchen ('+euro(p.price*4)+')',()=>{if(!cash(-p.price*4,'Vier Eiszeiten '+p.venue))return;S.arena.ice+=4;S.arena.price=p.price;S.arena.venue=p.venue;S.pending.splice(i,1);log('Vier Eiszeiten in '+p.venue+' gebucht.');close();save()}]);if(p.kind==='sponsor')opts.unshift(['Bessere Konditionen verhandeln',()=>{let chance=Math.min(.75,.25+S.municipality.trust/250+S.players.length/80);if(Math.random()<chance){let rise=rand(1,4)*100;p.total+=rise;p.desc='Nachverhandeltes Saisonangebot '+euro(p.total)+'. Werbeleistungen und zwei Zahlungsraten bleiben vorgesehen.';log(p.name+' erhöht nach Verhandlung das Angebot um '+euro(rise)+'.')}else{log(p.name+' lehnt eine Erhöhung ab. Das Angebot bleibt unverändert.')}close();save()}]);if(p.kind==='sponsor')opts.unshift(['Vertrag unterschreiben',()=>{S.sponsors.push({name:p.name,total:p.total,paid:0,first:Math.round(p.total*.6),second:p.total-Math.round(p.total*.6),signed:S.week,secondWeek:S.week+rand(7,11),firstPaid:false,secondPaid:false,firstWeek:S.week+rand(1,2)});S.pending.splice(i,1);log('Sponsorenvertrag mit '+p.name+' über '+euro(p.total)+' abgeschlossen. Zahlungen stehen aus.');close();save()}]);if(p.kind==='grant')opts.unshift(['Förderung annehmen',()=>{S.municipality.grant=p.amount;S.pending.splice(i,1);log('Gemeinde bewilligt '+euro(p.amount)+'. Auszahlung wird später erwartet.');close();save()}]);if(p.kind==='opponent')opts.unshift(['Testspiel vereinbaren',()=>{S.fixtures.push({week:S.week+2,opponent:p.name,power:p.power,home:false,kind:'Testspiel'});S.pending.splice(i,1);log('Testspiel gegen '+p.name+' für Woche '+(S.week+2)+' angesetzt.');close();save()}]);opts.unshift(['Ablehnen',()=>{S.pending.splice(i,1);log('Angebot abgelehnt: '+p.title);close();save()}]);msg(p.title,'<p>'+p.desc+'</p><p class="muted">Deine Zustimmung ist erforderlich. Angebote sind ausschließlich Teil der Simulation.</p>',opts)}
function sponsorsPage(){return card('Sponsoren & Partner','<p>Kontaktiere fiktive regionale Unternehmen, verhandle Konditionen und entscheide selbst über Vertragsabschlüsse. Geld zählt erst beim tatsächlichen simulierten Zahlungseingang.</p>'+btn('Fünf Betriebe ansprechen','contactSponsors()')+'<h3>Aktive Verträge</h3>'+(!S.sponsors.length?'<p class="muted">Noch keine Verträge.</p>':'')+S.sponsors.map(x=>'<div class="line"><div><b>'+x.name+'</b><small>Gesamt '+euro(x.total)+' · bezahlt '+euro(x.paid)+'</small></div><span class="pill">'+euro(x.total-x.paid)+' offen</span></div>').join('')+'<h3>Anfragen</h3>'+S.requests.filter(x=>x.type==='sponsor').map(x=>'<div class="line">'+x.label+'<span class="pill">In Prüfung</span></div>').join(''))}
function contactSponsors(){act('Sponsoren',()=>{let taken=new Set([...S.sponsors.map(x=>x.name),...S.requests.filter(x=>x.type==='sponsor').map(x=>x.payload.name),...S.pending.filter(x=>x.kind==='sponsor').map(x=>x.name)]);let options=sponsors.filter(x=>!taken.has(x)).slice(0,5);options.forEach(name=>addRequest('sponsor','Sponsorenanfrage: '+name,{name}));if(!options.length)log('Alle verfügbaren Sponsoren wurden bereits kontaktiert.')})}
function municipality(){return card('Gemeinde Kirchdorf · Rathausgespräche','<p>Du kannst um Förderungen ersuchen, den Kader vorstellen oder über eine eigene Eisarena sprechen. Die Gemeinde entscheidet abhängig von Mitgliederzahl, Trainingsbetrieb, Finanzen und Vertrauen. Das ist eine fiktive Gesprächssimulation, kein echter Behördenkontakt.</p><div class="line">Vertrauen <b>'+S.municipality.trust+'/100</b></div>'+bar(S.municipality.trust)+'<div class="line">Förderstatus <b>'+(S.municipality.grant?'Bewilligt '+euro(S.municipality.grant):S.municipality.submitted?'In Prüfung':'Nicht beantragt')+'</b></div><div class="actions">'+btn('Gespräch über Verein','municipalTalk()')+btn('Förderkonzept einreichen','applyGrant()',S.municipality.submitted)+btn('Eigene Arena besprechen','arenaTalk()')+'</div>')}
function municipalTalk(){
dialogue('Gemeindegespräch','„Guten Tag. Wie soll der neue Verein finanziert werden? Und welche Vorteile hat Kirchdorf davon?“',[
['Wir bieten Jugendlichen langfristig eine sportliche Perspektive.',()=>municipalResponse('„Nachwuchsarbeit wäre für uns ein wichtiges Argument. Habt ihr schon konkrete Pläne?“',7)],
['Wir haben '+S.players.length+' Spieler und '+S.arena.ice+' bezahlte Eisstunden.',()=>municipalResponse('„Konkrete Zahlen helfen uns. Bitte haltet die Entwicklung schriftlich fest.“',S.players.length>=10?9:4)],
['Wir wollen eine eigene Eisarena errichten.',()=>municipalResponse('„Das ist ein großes Vorhaben. Ohne Grundstück, Kostenrechnung und Betriebskonzept können wir keine Zusage machen.“',2)],
['Wir brauchen sofort Geld von der Gemeinde.',()=>municipalResponse('„Förderungen werden nach Prüfung vergeben, nicht auf Zuruf.“',-6)],
['Gespräch beenden',close]
]);}
function municipalResponse(reply,trust){S.municipality.trust=Math.max(0,Math.min(100,S.municipality.trust+trust));log('Gemeindegespräch geführt. Vertrauensänderung: '+(trust>0?'+':'')+trust+'.');save();dialogue('Rückmeldung der Gemeinde',reply+'<br>Gemeindevertrauen: '+S.municipality.trust+'/100',[
['Fördermöglichkeiten besprechen',()=>dialogue('Förderberatung','„Ein schriftliches Konzept mit Mitgliedern, Eiszeiten, Einnahmen und Ausgaben ist Voraussetzung.“',[
['Förderkonzept einreichen',()=>{if(S.municipality.submitted){msg('Antrag läuft','Es liegt bereits ein Antrag zur Prüfung vor.');return}S.municipality.submitted=true;addRequest('grant','Förderantrag Gemeinde',{});close();save()}],
['Zurück',close]])],
['Gespräch abschließen',close]
]);}
function applyGrant(){confirmAction('Förderantrag einreichen','Der Antrag wird unverbindlich geprüft. Eine Zusage ist nicht garantiert. Kosten: 0 €.',()=>act('Förderantrag',()=>{S.municipality.submitted=true;addRequest('grant','Förderantrag Gemeinde',{})}))}
function arenaTalk(){msg('Eigene Eisarena – Gemeinde','<p>„Eine eigene Eisfläche wäre ein langfristiges Infrastrukturprojekt. Ohne Standort, Betriebskonzept und Finanzierung können wir keine Unterstützung zusagen.“</p><p>Eine erste Konzeptprüfung kann für 1.200 € beauftragt werden. Alternativ bleibt es beim unverbindlichen Gespräch.</p>',[['Konzeptprüfung beauftragen (1.200 €)',()=>{if(!cash(-1200,'Arena-Machbarkeitskonzept'))return;S.arena.proposal=true;S.municipality.trust+=5;log('Machbarkeitskonzept für eigene Eisarena beauftragt.');close();save()}],['Nur Gespräch beenden',()=>{log('Unverbindliches Gespräch zur eigenen Arena geführt.');close();save()}]])}
function arenaPage(){ensureArenaProject();let a=S.arenaProject;let steps=['Idee','Standortprüfung','Machbarkeit','Finanzierung','Bau','Betrieb'];return card('Eis & Arena','<p>Der Bau einer eigenen Eishalle ist ein langfristiges Projekt. Alle Standorte, Preise und Gesprächspartner sind fiktive Simulationsdaten.</p><div class="line">Aktuelle Trainingsstätte <b>'+S.arena.venue+'</b></div><div class="line">Bezahlte Eisstunden <b>'+S.arena.ice+'</b></div><div class="actions">'+btn('Trainingszeiten anfragen','iceRequest()')+btn('Heimspiel-Eis anfragen','homeRequest()')+'</div>')+card('Eigene Arena – Projektsteuerung','<div class="line">Projektphase <b>'+steps[a.stage]+'</b></div><div class="line">Grundstück <b>'+(a.site?a.site.name:'Nicht ausgewählt')+'</b></div><div class="line">Geplante Kapazität <b>'+a.capacity+' Plätze</b></div><div class="line">Finanzierungszusagen (verbindlich) <b>'+euro(a.pledged)+'</b></div><div class="line">Kreditverbindlichkeit <b>'+euro(a.loan)+'</b></div><div class="line">Baufortschritt <b>'+a.progress+'%</b></div>'+bar(a.progress)+'<h3>Standort & Planung</h3><div class="actions">'+btn('Grundstücke untersuchen (0 €)','siteSearch()',a.stage>=4)+btn('Machbarkeitsstudie (1.200 €)','studyArena()',!a.site||a.study)+btn('Finanzierungsgespräche (0 €)','arenaFundingTalk()',!a.study||a.stage>=4)+btn('Bauprojekt konfigurieren','arenaBuildDialog()',!a.study||a.stage>=4)+'</div><p class="muted">Für einen Bau sind ein geprüfter Standort, die Machbarkeitsstudie und ausreichende Finanzmittel erforderlich. Die Kreditzusage ist nicht automatisch eine Auszahlung.</p>')+card('Baufortschritt und Stadionbetrieb',arenaOperationsPanel())+card('Projektprotokoll',a.history.slice(0,10).map(x=>'<div class="line"><small>'+x+'</small></div>').join('')||'<p class="muted">Noch keine Projektschritte.</p>')}
function ensureArenaProject(){if(!S.arenaProject)S.arenaProject={stage:0,site:null,study:false,capacity:300,pledged:0,loan:0,loanRate:0,loanRemaining:0,loanTerm:0,progress:0,constructionCost:0,paidConstruction:0,history:[],operating:false,maintenance:0,siteOptions:[],buildWeeks:0,grantAsked:false};let a=S.arenaProject;if(a.ticketPrice==null)a.ticketPrice=10;if(a.catering==null)a.catering=false;if(a.matchOperationsApproved==null)a.matchOperationsApproved=false;if(a.completedPayments==null)a.completedPayments=0;if(a.maintenance==null)a.maintenance=0;return a}
function siteSearch(){let a=ensureArenaProject();a.siteOptions=[{name:'Gewerbegebiet – Randlage',price:85000,risk:'Gute Erreichbarkeit, mögliche Lärmschutzauflagen',score:65},{name:'Sportzentrum – Nachbarfläche',price:130000,risk:'Sportliche Synergien, begrenzte Fläche',score:80},{name:'Außerorts – Freifläche',price:60000,risk:'Günstiger, hohe Erschließungskosten',score:45}];msg('Fiktive Grundstücke','<p>Unverbindliche Standortprüfung. Kein Grundstück ist real reserviert oder gekauft.</p>'+a.siteOptions.map((x,i)=>'<div class="line"><div><b>'+x.name+'</b><small>'+x.risk+' · Kaufpreis '+euro(x.price)+'</small></div>'+btn('Auswählen','selectSite('+i+')')+'</div>').join(''),[['Später',close]])}
function selectSite(i){let a=ensureArenaProject(),x=a.siteOptions[i];if(!x)return;confirmAction('Standort auswählen',x.name+' wird als Planungsstandort vorgemerkt. Es entstehen noch keine Kosten und kein Eigentum.',()=>{a.site={...x};a.stage=Math.max(a.stage,1);a.history.unshift('Woche '+S.week+': Standort '+x.name+' für Planung ausgewählt.');log('Planungsstandort für Arena ausgewählt: '+x.name+'.');save()})}
function studyArena(){let a=ensureArenaProject();confirmAction('Machbarkeitsstudie beauftragen','Die Studie kostet einmalig 1.200 €. Sie ist eine fiktive Planungsprüfung, keine echte Baugenehmigung.',()=>{if(!cash(-1200,'Arena-Machbarkeitsstudie'))return;a.study=true;a.stage=Math.max(a.stage,2);a.history.unshift('Woche '+S.week+': Machbarkeitsstudie abgeschlossen.');log('Machbarkeitsstudie für Arena abgeschlossen.');save()})}
function arenaFundingTalk(){let a=ensureArenaProject();dialogue('Finanzierungsgespräch','„Eine Eisfläche benötigt erhebliche Investitionen. Welche Finanzierung wollen Sie prüfen?“',[
['Bankdarlehen unverbindlich anfragen',()=>{let max=Math.max(0,Math.round((S.sponsors.reduce((n,x)=>n+x.total,0)*15+S.fan*400)/1000)*1000);a.history.unshift('Woche '+S.week+': Bank prüft höchstens '+euro(max)+' Darlehen; keine Zusage.');msg('Bankgespräch','<p>Die Bank stellt nach erster Einschätzung höchstens '+euro(max)+' als möglichen Kreditrahmen in Aussicht. Für einen Arenabau ist das voraussichtlich nicht ausreichend. Keine Auszahlung.</p>',[['Schließen',close]]);save()}],
['Gemeinde um unverbindliche Unterstützung bitten',()=>{a.grantAsked=true;a.history.unshift('Woche '+S.week+': Gemeinde um Infrastrukturgespräch gebeten.');S.municipality.trust=Math.min(100,S.municipality.trust+1);msg('Gemeinde','<p>„Wir prüfen nur konkrete, tragfähige Konzepte. Eine Finanzierungszusage können wir nicht machen.“</p>',[['Schließen',close]]);save()}],
['Private Geldgeber ansprechen',()=>{let potential=Math.max(0,Math.round(S.fan*100+S.municipality.trust*80));a.history.unshift('Woche '+S.week+': Investorenpotenzial unverbindlich auf '+euro(potential)+' geschätzt.');msg('Investoren','<p>Unverbindliches Interesse von bis zu '+euro(potential)+'. Es ist weder zugesagt noch eingegangen.</p>',[['Schließen',close]]);save()}],
['Zurück',close]])}
function arenaBuildDialog(){let a=ensureArenaProject();let cap=a.capacity;let base=1200000+cap*1800+a.site.price;let due=Math.round(base*.15);msg('Arena-Bauprojekt','<p>Modell: einfache überdachte Kunsteisfläche, '+cap+' Plätze.</p><p>Grobe Investition: <b>'+euro(base)+'</b> einschließlich Grundstücksannahme, ohne echte Behörden- und Fachplanung.</p><p>Vor Baubeginn müssten mindestens 15 % als liquide Anzahlung verfügbar sein: <b>'+euro(due)+'</b>. Aktuelle Kasse: '+euro(S.cash)+'.</p><label>Kapazität</label><select id="arenaCap"><option value="300">300 Plätze</option><option value="500">500 Plätze</option><option value="800">800 Plätze</option></select>',[['Kalkulation übernehmen',()=>{a.capacity=+document.getElementById('arenaCap').value;a.constructionCost=1200000+a.capacity*1800+a.site.price;a.stage=Math.max(a.stage,3);a.history.unshift('Woche '+S.week+': Baukalkulation '+euro(a.constructionCost)+' für '+a.capacity+' Plätze erstellt.');log('Arenakalkulation erstellt; kein Bauauftrag.');close();save()}],['Bau freigeben',()=>{if(!a.constructionCost){msg('Erst kalkulieren','Übernimm zunächst eine Kalkulation.');return}let deposit=Math.round(a.constructionCost*.15);if(S.cash<deposit){msg('Finanzierung nicht gesichert','Für die erste Bauzahlung fehlen '+euro(deposit-S.cash)+'. Es wurde kein Bau beauftragt.');return}confirmAction('Verbindlicher Bauauftrag','Die Anzahlung '+euro(deposit)+' wird sofort bezahlt. Weitere Zahlungen erfordern gesonderte Genehmigung.',()=>{if(!cash(-deposit,'Arena-Bauanzahlung'))return;a.paidConstruction=deposit;a.stage=4;a.progress=1;a.buildWeeks=0;a.history.unshift('Woche '+S.week+': Bau beauftragt, Anzahlung bezahlt.');save()})}],['Schließen',close]])}

function arenaOperationsPanel(){let a=ensureArenaProject(),left=Math.max(0,a.constructionCost-a.paidConstruction);
let content='<div class="line">Bisher bezahlte Baukosten <b>'+euro(a.paidConstruction)+'</b></div><div class="line">Restliche Baukosten <b>'+euro(left)+'</b></div>';
if(a.stage===4){let installment=Math.min(left,Math.max(1,Math.round(a.constructionCost*.20)));content+='<p>Die Baustelle bleibt bei maximal 25 % Fortschritt stehen, bis weitere Bauabschnitte bezahlt werden. Jeder Abschnitt benötigt eine eigene Freigabe.</p>'+btn('Nächsten Bauabschnitt zahlen ('+euro(installment)+')','payArenaStage()')}
if(a.stage===5){content+='<div class="line">Zuschauerkapazität <b>'+a.capacity+'</b></div><div class="line">Eintrittspreis <b>'+euro(a.ticketPrice)+'</b></div><div class="line">Gastronomie <b>'+(a.catering?'Aktiv':'Nicht eingerichtet')+'</b></div><div class="line">Spieltagbetrieb <b>'+(a.matchOperationsApproved?'Genehmigt':'Noch nicht genehmigt')+'</b></div><div class="actions">'+btn('Eintrittspreis festlegen','setArenaTicket()')+btn('Gastronomie einrichten (4.000 €)','setupCatering()',a.catering)+btn('Spieltagbetrieb genehmigen','approveArenaOperations()',a.matchOperationsApproved)+'</div><p class="muted">Bei genehmigtem Spieltagbetrieb: 450 € Kosten je Heimspiel. Eintrittserlöse und Gastronomie werden nur für tatsächlich gespielte Heimspiele gebucht. Ohne Freigabe keine Arena-Heimspiele.</p>'}
if(a.stage<4)content+='<p class="muted">Zuerst Standort, Machbarkeitsstudie, Finanzierung und Bauentscheidung klären.</p>';
return content}
function payArenaStage(){let a=ensureArenaProject();if(a.stage!==4)return;let remaining=Math.max(0,a.constructionCost-a.paidConstruction);let due=Math.min(remaining,Math.max(1,Math.round(a.constructionCost*.20)));if(!remaining)return;
confirmAction('Bauabschnitt freigeben','Für den nächsten Bauabschnitt werden '+euro(due)+' bezahlt. Es erfolgt keine automatische Kreditaufnahme.',()=>{
if(!cash(-due,'Arena-Bauabschnitt'))return;
a.paidConstruction+=due;a.completedPayments++;a.progress=Math.min(99,Math.round(100*a.paidConstruction/a.constructionCost));a.history.unshift('Woche '+S.week+': Bauabschnitt bezahlt: '+euro(due)+'.');log('Bauabschnitt finanziert: '+euro(due)+'.');
if(a.paidConstruction>=a.constructionCost){a.progress=100;a.stage=5;a.operating=true;a.maintenance=450;a.history.unshift('Woche '+S.week+': Arena fertiggestellt und technisch abgenommen (Simulation).');log('Eigene Arena fertiggestellt. Spieltagbetrieb muss noch genehmigt werden.')}save()})}
function setArenaTicket(){let a=ensureArenaProject();msg('Eintrittspreis festlegen','<p>Wähle einen Preis pro Zuschauer. Höhere Preise können die Nachfrage senken.</p><label>Ticketpreis</label><select id="ticketChoice">'+[5,8,10,12,15,20].map(v=>'<option value="'+v+'" '+(a.ticketPrice===v?'selected':'')+'>'+euro(v)+'</option>').join('')+'</select>',[['Preis übernehmen',()=>{a.ticketPrice=+document.getElementById('ticketChoice').value;a.history.unshift('Woche '+S.week+': Eintrittspreis auf '+euro(a.ticketPrice)+' festgelegt.');close();save()}],['Abbrechen',close]])}
function setupCatering(){let a=ensureArenaProject();if(a.stage!==5||a.catering)return;confirmAction('Gastronomie einrichten','Einmalig 4.000 € für die Grundausstattung. Bei gespielten Heimspielen entstehen variable Warenkosten, die vom Umsatz abgezogen werden.',()=>{if(!cash(-4000,'Arena-Gastronomie Ausstattung'))return;a.catering=true;log('Arena-Gastronomie eingerichtet.');save()})}
function approveArenaOperations(){let a=ensureArenaProject();if(a.stage!==5)return;confirmAction('Heimspielbetrieb freigeben','Du genehmigst 450 € Betriebskosten je tatsächlich ausgetragenem Heimspiel in der eigenen Arena. Diese Kosten werden beim Spiel automatisch gebucht, sofern die Kasse reicht. Keine pauschale Abbuchung.',()=>{a.matchOperationsApproved=true;a.history.unshift('Woche '+S.week+': Spieltagbetrieb zu 450 € pro Heimspiel genehmigt.');log('Heimspielbetrieb in eigener Arena freigegeben.');save()})}
function stadiumMatchday(f){let a=ensureArenaProject();if(a.stage!==5||!a.matchOperationsApproved)return false;
if(S.cash<450){log('Arena-Heimspiel nicht möglich: 450 € Betriebskosten nicht gedeckt.');return false}
cash(-450,'Arena-Heimspielbetrieb: '+f.opponent);
let base=Math.max(12,Math.round(S.fan*.65+rand(0,35)));
let demand=Math.max(0.35,1-(a.ticketPrice-10)*.035);
let attendance=Math.min(a.capacity,Math.max(0,Math.round(base*demand)));
let tickets=attendance*a.ticketPrice;
cash(tickets,'Eintritt: '+f.opponent+' ('+attendance+' Zuschauer)');
let gross=0,cost=0;
if(a.catering){gross=attendance*rand(3,6);cost=Math.round(gross*.48);cash(gross,'Gastronomie-Umsatz: '+f.opponent);cash(-cost,'Gastronomie-Wareneinsatz: '+f.opponent)}
f.attendance=attendance;f.ticketRevenue=tickets;f.cateringRevenue=gross;f.cateringCosts=cost;
log('Heimspiel in eigener Arena: '+attendance+' Zuschauer, Tickets '+euro(tickets)+'.');return true}
function iceRequest(){act('Eis',()=>addRequest('ice','Trainingszeiten in der Region anfragen',{}))}
function homeRequest(){act('Heim',()=>addRequest('home','Heimspiel-Eiszeiten anfragen',{}))}
function ensureLeagueFields(){if(!('league' in S))S.league=null;if(!S.scorers)S.scorers={};if(!S.matchReports)S.matchReports=[];}
function leagueTable(){if(!S.league)return '';let teams=Object.values(S.league.teams).sort((a,b)=>b.pts-a.pts||((b.gf-b.ga)-(a.gf-a.ga))||b.gf-a.gf);return '<h3>Ligatabelle</h3><table><tr><th>#</th><th>Verein</th><th>Sp.</th><th>S</th><th>N</th><th>Tore</th><th>Pkt.</th></tr>'+teams.map((t,i)=>'<tr><td>'+(i+1)+'</td><td>'+(t.name==='Kirchdorf Mangei'?'<b>'+t.name+'</b>':t.name)+'</td><td>'+t.gp+'</td><td>'+t.w+'</td><td>'+t.l+'</td><td>'+t.gf+':'+t.ga+'</td><td>'+t.pts+'</td></tr>').join('')+'</table>'}
function games(){ensureLeagueFields();let avg=S.players.length?Math.round(S.players.reduce((a,p)=>a+p.skill,0)/S.players.length):0;return card('Spielbetrieb','<p>Fiktive Tiroler Hobbyliga mit Hin- und Rückrunde, Tabelle und Spielerstatistik. Eine Anmeldung und jeder Heimspieltermin benötigen deine Zustimmung. Spiele werden erst in ihrer angesetzten Woche simuliert.</p><div class="line">Teamstärke <b>'+avg+'</b></div><div class="line">Teamchemie <b>'+S.chem+'/100</b></div><div class="line">Gespielte Begegnungen <b>'+S.played.length+'</b></div><div class="actions">'+btn('Testspielgegner anfragen','opponentRequest()')+(S.league?'':btn('Ligateilnahme beantragen','leagueApply()'))+'</div>'+(S.league?'<div class="notice">Liga: '+S.league.status+' · Saison '+S.season+'</div>'+leagueTable():'<p class="muted">Noch keine Liga-Anmeldung. Für den Ligabetrieb sind mindestens 12 Spieler inklusive Torhüter und ein Heimspielbudget erforderlich.</p>')+'<h3>Nächste Spiele</h3>'+S.fixtures.slice().sort((a,b)=>a.week-b.week).map(f=>'<div class="line"><div><b>'+f.kind+': '+f.opponent+'</b><small>Woche '+f.week+' · '+(f.home?'Heim':'Auswärts')+'</small></div>'+(f.home&&!f.icePaid&&!(S.arenaProject&&S.arenaProject.stage===5&&S.arenaProject.matchOperationsApproved)?btn('Eis buchen '+euro(f.iceCost||440),'bookMatchIce('+f.id+')'):'<span class="pill">'+(f.home?(f.icePaid?'Eis gesichert':'Eigene Arena'):'Auswärts')+'</span>')+'</div>').join('')+'<h3>Detaillierte Spielberichte</h3>'+(S.detailedReports||[]).map((r,i)=>'<div class="line"><div>'+r.opponent+'<small>Woche '+r.week+' · '+r.score.join(':')+'</small></div>'+btn('Bericht','matchReport('+i+')')+'</div>').join('')+'<h3>Ergebnisse & Spielberichte</h3>'+S.played.slice().reverse().map(f=>'<div class="line"><div>'+f.kind+': '+f.opponent+'<small>Woche '+f.week+'</small></div><b>'+f.goals+' : '+f.against+'</b></div>').join('')+(S.matchReports.length?S.matchReports.slice(0,8).map(r=>'<p class="muted">'+r+'</p>').join(''):'')+'<h3>Torjäger</h3>'+Object.entries(S.scorers).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([n,g])=>'<div class="line">'+n+'<b>'+g+' Tore</b></div>').join(''))}
function leagueApply(){ensureLeagueFields();if(S.players.length<12||!S.players.some(p=>p.pos==='TW')){msg('Kader zu klein','Für die Liga brauchst du mindestens 12 Spieler, darunter einen Torhüter.');return}if(S.league){msg('Bereits angemeldet','Eine Anmeldung ist bereits aktiv.');return}confirmAction('Ligateilnahme beantragen','Fiktive Hobbyliga mit 8 Mannschaften, 14 Spieltagen (Hin- und Rückrunde). Einmalige Ligagebühr 350 €. Für jedes Heimspiel muss später separat Eis gebucht werden. Teilnahme ist eine Spielentscheidung, keine echte Verbandsmeldung.',()=>{if(!cash(-350,'Ligaanmeldung Saison '+S.season))return;S.league={status:'Angemeldet',teams:{},round:0};let names=['Kirchdorf Mangei',...S.opponents.map(x=>x.name)];names.forEach(name=>S.league.teams[name]={name,gp:0,w:0,l:0,draw:0,gf:0,ga:0,pts:0});let order=names.slice();let rounds=[];for(let r=0;r<7;r++){let pairs=[];for(let i=0;i<4;i++)pairs.push([order[i],order[7-i]]);rounds.push(pairs);order=[order[0],order[7],...order.slice(1,7)]}let w=S.week+2;let ix=0;for(let leg=0;leg<2;leg++)for(let r=0;r<7;r++){let week=w+ix++;for(let [a,b] of rounds[r]){if(leg===1)[a,b]=[b,a];if(a==='Kirchdorf Mangei'||b==='Kirchdorf Mangei'){let home=a==='Kirchdorf Mangei',opponent=home?b:a;S.fixtures.push({id:++seq,week,opponent,power:S.opponents.find(x=>x.name===opponent).power,home,kind:'Liga',icePaid:!home,iceCost:440});}else{if(!S.league.otherFixtures)S.league.otherFixtures=[];S.league.otherFixtures.push({week,a,b})}}}log('Ligaanmeldung abgeschlossen. 14 Spieltage angesetzt. Heimspiele benötigen separate Eisbuchungen.');save();render()})}
function bookMatchIce(id){let f=S.fixtures.find(x=>x.id===id);if(!f||!f.home||f.icePaid)return;if(S.arenaProject&&S.arenaProject.stage===5&&S.arenaProject.matchOperationsApproved){msg('Eigene Arena','Dieses Heimspiel kann in der eigenen Arena stattfinden. Es ist keine externe Eisbuchung erforderlich.');return}confirmAction('Heimspieleis buchen','Zwei Stunden Eisfläche einschließlich Spielvorbereitung: '+euro(f.iceCost)+'. Die Buchung gilt nur für '+f.opponent+' in Woche '+f.week+'.',()=>{if(!cash(-f.iceCost,'Heimspieleis gegen '+f.opponent))return;f.icePaid=true;log('Heimspieleis gegen '+f.opponent+' gebucht.');save();render()})}
function updateStanding(a,b,ga,gb){let ta=S.league.teams[a],tb=S.league.teams[b];if(!ta||!tb)return;ta.gp++;tb.gp++;ta.gf+=ga;ta.ga+=gb;tb.gf+=gb;tb.ga+=ga;if(ga>gb){ta.w++;tb.l++;ta.pts+=3}else if(gb>ga){tb.w++;ta.l++;tb.pts+=3}else{ta.draw++;tb.draw++;ta.pts++;tb.pts++}}
function opponentRequest(){act('Gegner',()=>addRequest('opponent','Testspielgegner kontaktieren',{}))}

function ensureTactics(){if(!S.tactics)S.tactics={style:'Ausgewogen',pressure:'Normal',goalie:null,lines:[],defense:[],powerplay:'Standard'};if(!S.tactics.lines)S.tactics.lines=[];if(!S.tactics.defense)S.tactics.defense=[];}
function eligiblePlayers(pos){return S.players.filter(p=>p.pos===pos)}
function setTactic(field,value){ensureTactics();S.tactics[field]=value;log('Taktische Einstellung geändert: '+field+' = '+value+'.');save();render()}
function assignSlot(group,index,id){ensureTactics();let player=S.players.find(p=>p.id===+id);if(!player)return;let all=[...(S.tactics.lines||[]),...(S.tactics.defense||[])];if(all.includes(player.id)){msg('Doppelte Besetzung','Ein Spieler kann nur einem Feldspielerplatz zugewiesen werden.');return}S.tactics[group][index]=player.id;log(player.name+' in die Aufstellung übernommen.');save();render()}
function clearSlot(group,index){ensureTactics();S.tactics[group][index]=null;save();render()}
function tacticsPage(){ensureTactics();let t=S.tactics;let names={};S.players.forEach(p=>names[p.id]=p.name+' ('+p.skill+')');let selector=(group,index,pos,label)=>'<div class="line"><div><b>'+label+'</b><small>'+(names[t[group][index]]||'Nicht besetzt')+'</small></div><div class="actions">'+(t[group][index]?btn('Entfernen',`clearSlot('${group}',${index})`):'')+'<select style="width:160px;margin:0" onchange="if(this.value)assignSlot(\''+group+'\','+index+',this.value)"><option value="">Spieler wählen</option>'+eligiblePlayers(pos).filter(p=>!t.lines.includes(p.id)&&!t.defense.includes(p.id)).map(p=>'<option value="'+p.id+'">'+p.name+' ('+p.skill+')</option>').join('')+'</select></div></div>';
let positions=['LW','C','RW'];let out='<div class="grid"><div>'+card('Sturmreihen','<p>Bis zu drei Sturmreihen. Jede Position wird individuell besetzt. Nicht eingeteilte Spieler bleiben Ersatzspieler.</p>'+Array.from({length:3},(_,i)=>'<h3>Sturmreihe '+(i+1)+'</h3>'+positions.map((pos,j)=>selector('lines',i*3+j,'S',pos)).join('')).join(''))+card('Verteidigung','<p>Bis zu drei Verteidigungspaare.</p>'+Array.from({length:3},(_,i)=>'<h3>Verteidigung '+(i+1)+'</h3>'+selector('defense',i*2,'V','Links')+selector('defense',i*2+1,'V','Rechts')).join(''))+'</div><div>';
out+=card('Torhüter','<p>Der gewählte Starter beeinflusst die Gegentorwahrscheinlichkeit.</p><select onchange="setTactic(\'goalie\',+this.value)"><option value="">Starter wählen</option>'+eligiblePlayers('TW').map(p=>'<option value="'+p.id+'" '+(t.goalie===p.id?'selected':'')+'>'+p.name+' ('+p.skill+')</option>').join('')+'</select>');
out+=card('Spielsystem','<p>Deine Strategie beeinflusst Chancen, Gegentore und Fitnessverbrauch.</p><label>Spielstil</label><select onchange="setTactic(\'style\',this.value)">'+['Defensiv','Ausgewogen','Offensiv'].map(v=>'<option '+(t.style===v?'selected':'')+'>'+v+'</option>').join('')+'</select><label>Forechecking</label><select onchange="setTactic(\'pressure\',this.value)">'+['Zurückhaltend','Normal','Aggressiv'].map(v=>'<option '+(t.pressure===v?'selected':'')+'>'+v+'</option>').join('')+'</select><label>Überzahl</label><select onchange="setTactic(\'powerplay\',this.value)">'+['Standard','Schüsse von der blauen Linie','Scheibenbesitz'].map(v=>'<option '+(t.powerplay===v?'selected':'')+'>'+v+'</option>').join('')+'</select>');
out+=card('Aufstellungsstatus','<div class="line">Stürmer eingeteilt <b>'+t.lines.filter(Boolean).length+'/9</b></div><div class="line">Verteidiger eingeteilt <b>'+t.defense.filter(Boolean).length+'/6</b></div><div class="line">Starter <b>'+(names[t.goalie]||'Nicht gewählt')+'</b></div><p class="muted">Für Spiele sind mindestens sechs Stürmer, vier Verteidiger und ein Torhüter nötig. Nicht eingeteilte Spieler können als Ersatz einspringen, wenn der Kader spielfähig ist.</p>');return out+'</div></div>'}
function simulateMatch(f){ensureTactics();ensureCareers();let t=S.tactics,forwards=S.players.filter(p=>p.pos==='S'&&p.fitness>=40&&p.injuredUntil<=S.week),defenders=S.players.filter(p=>p.pos==='V'&&p.fitness>=40&&p.injuredUntil<=S.week),goalies=S.players.filter(p=>p.pos==='TW'&&p.fitness>=40&&p.injuredUntil<=S.week);let ready=forwards.length>=6&&defenders.length>=4&&goalies.length>=1;
if(!ready){log(f.kind+' gegen '+f.opponent+' abgesagt: nicht genügend einsatzfähige Feldspieler oder Torhüter.');if(f.kind==='Liga')updateStanding('Kirchdorf Mangei',f.opponent,0,5);S.played.push({...f,goals:0,against:5,forfeit:true});return}
if(f.home&&!f.icePaid&&!(S.arenaProject&&S.arenaProject.stage===5&&S.arenaProject.matchOperationsApproved)){log('Heimspiel gegen '+f.opponent+' wegen fehlender Eisbuchung mit 0:5 gewertet.');if(f.kind==='Liga')updateStanding('Kirchdorf Mangei',f.opponent,0,5);S.played.push({...f,goals:0,against:5,forfeit:true});return}
if(f.home&&S.arenaProject&&S.arenaProject.stage===5&&!f.icePaid){if(!stadiumMatchday(f)){log('Heimspiel wegen ungedeckter Betriebskosten ausgefallen.');if(f.kind==='Liga')updateStanding('Kirchdorf Mangei',f.opponent,0,5);S.played.push({...f,goals:0,against:5,forfeit:true});return}}let activeIds=[...t.lines,...t.defense].filter(Boolean),selected=S.players.filter(p=>activeIds.includes(p.id)&&p.fitness>=40&&p.injuredUntil<=S.week);let avg=(selected.length>=10?selected:S.players.filter(p=>p.fitness>=40&&p.injuredUntil<=S.week)).reduce((a,p)=>a+p.skill,0)/(selected.length>=10?selected:S.players.filter(p=>p.fitness>=40&&p.injuredUntil<=S.week)).length;let goalie=goalies.find(p=>p.id===t.goalie)||goalies[0];let strength=avg+(S.chem-50)/8+(goalie.skill-60)/9;let style=t.style==='Offensiv'?1:t.style==='Defensiv'?-1:0;let pressure=t.pressure==='Aggressiv'?1:t.pressure==='Zurückhaltend'?-1:0;let periodScores=[],scorers=[],events=[];
for(let period=1;period<=3;period++){let ours=Math.max(0,rand(0,2)+Math.round((strength-f.power)/22)+(Math.random()<.35?style:0)+(Math.random()<.18?pressure:0));let theirs=Math.max(0,rand(0,2)+Math.round((f.power-strength)/22)+(Math.random()<.3?-style:0)+(Math.random()<.15?pressure:0));periodScores.push([ours,theirs]);for(let i=0;i<ours;i++){let player=pick(forwards);scorers.push(player.name);S.scorers[player.name]=(S.scorers[player.name]||0)+1;events.push({period,minute:rand(1,20),type:'Tor Mangei',detail:player.name})}for(let i=0;i<theirs;i++)events.push({period,minute:rand(1,20),type:'Gegentor',detail:f.opponent});if(Math.random()<.55)events.push({period,minute:rand(1,20),type:'Strafzeit',detail:pick(S.players).name+' – 2 Minuten'});}
let g=periodScores.reduce((a,x)=>a+x[0],0),a=periodScores.reduce((v,x)=>v+x[1],0);events.sort((x,y)=>x.period-y.period||x.minute-y.minute);let report={week:S.week,opponent:f.opponent,kind:f.kind,home:f.home,score:[g,a],periodScores,events,goalie:goalie.name,tactics:{...t}};if(!S.detailedReports)S.detailedReports=[];S.detailedReports.unshift(report);S.played.push({...f,goals:g,against:a,periodScores});if(f.kind==='Liga')updateStanding('Kirchdorf Mangei',f.opponent,g,a);S.fan=Math.max(0,S.fan+(g>a?rand(4,12):rand(-3,3)));S.matchReports.unshift('Woche '+S.week+': '+f.opponent+' – '+g+':'+a+' (Drittel '+periodScores.map(x=>x.join(':')).join(' / ')+').');log(f.kind+': Mangei '+g+':'+a+' '+f.opponent+'.');S.players.forEach(p=>{p.fitness=Math.max(35,p.fitness-rand(4,13)-(t.pressure==='Aggressiv'?4:0));if(Math.random()<.012){p.fitness=35;log(p.name+' fällt nach einer Blessur voraussichtlich eine Woche aus.')}})}
function matchReport(i){let r=(S.detailedReports||[])[i];if(!r)return;msg('Spielbericht: '+r.opponent,'<p><b>Kirchdorf Mangei '+r.score[0]+':'+r.score[1]+' '+r.opponent+'</b></p><p>Drittelergebnisse: '+r.periodScores.map((x,i)=>(i+1)+'. Drittel '+x.join(':')).join(' · ')+'</p><p>Torhüter: '+r.goalie+'</p><h3>Spielereignisse</h3>'+r.events.map(e=>'<div class="line"><span>'+e.period+'. Drittel · '+e.minute+'. Minute</span><span>'+e.type+': '+e.detail+'</span></div>').join(''),[['Schließen',close]])}
function ensureDevelopment(){if(!S.staff)S.staff=[];if(!S.staffCandidates)S.staffCandidates=[];if(!S.youth)S.youth={founded:false,players:[],investment:0,level:0};if(!S.transferMarket)S.transferMarket=[];if(!S.facilities)S.facilities={equipment:0,medical:0};}

card('Trainer & Betreuer','<p>Stelle Trainer, Physio oder Materialwart ein. Gehälter werden als laufende wöchentliche Kosten fällig. Jede Verpflichtung benötigt deine Zustimmung.</p><div class="actions">'+btn('Personal suchen (0 €)','searchStaff()')+'</div><h3>Angestellte</h3>'+(S.staff.map(x=>'<div class="line"><div><b>'+x.name+'</b><small>'+x.role+' · Qualität '+x.quality+'</small></div><span>'+euro(x.weekly)+'/Woche</span></div>').join('')||'<p class="muted">Noch niemand eingestellt.</p>')+'<h3>Bewerbungen</h3>'+(S.staffCandidates.map(x=>'<div class="line"><div><b>'+x.name+'</b><small>'+x.role+' · Qualität '+x.quality+' · '+euro(x.weekly)+'/Woche</small></div>'+btn('Gespräch','staffTalk('+x.id+')')+'</div>').join('')||'<p class="muted">Noch keine Bewerbungen.</p>'))+
card('Nachwuchsarbeit','<p>Gründe eine Nachwuchsgruppe, gewinne Talente und investiere in Ausbildung. Laufende Kosten werden im Finanzbuch ausgewiesen.</p><div class="line">Nachwuchsgruppe <b>'+(S.youth.founded?'Gegründet':'Nicht vorhanden')+'</b></div><div class="line">Nachwuchsspieler <b>'+S.youth.players.length+'</b></div><div class="line">Ausbildungsniveau <b>'+S.youth.level+'</b></div><div class="actions">'+(S.youth.founded?btn('Talentsichtung (80 €)','scoutYouth()')+btn('Jugendtraining fördern (200 €)','investYouth()'):btn('Nachwuchs gründen (500 €)','foundYouth()'))+'</div>'+S.youth.players.map((x,i)=>'<div class="line"><div><b>'+x.name+'</b><small>'+x.age+' Jahre · '+x.pos+' · Potenzial '+x.potential+'</small></div><span>Stärke '+x.skill+' '+(x.age>=17?btn('Hochziehen','promoteYouth('+i+')'):'')+'</span></div>').join(''))+
'</div><div>'+
card('Spielermarkt','<p>Verfügbare Spieler werden bei einer unverbindlichen Suche angezeigt. Ein Wechsel erfolgt erst nach einem persönlichen Vertragsgespräch.</p>'+btn('Spielermarkt beobachten','scanTransfers()')+S.transferMarket.map(x=>'<div class="line"><div><b>'+x.name+'</b><small>'+x.pos+' · '+x.age+' Jahre · Stärke '+x.skill+'</small></div>'+btn('Verhandeln','transferTalk('+x.id+')')+'</div>').join(''))+
card('Infrastruktur','<p>Vereinseigene Ausstattung und medizinische Betreuung können schrittweise verbessert werden.</p><div class="line">Trainingsausstattung <b>Stufe '+S.facilities.equipment+'</b></div>'+btn('Ausstattung verbessern (350 €)','upgradeFacility("equipment",350)')+'<div class="line">Medizinische Ausstattung <b>Stufe '+S.facilities.medical+'</b></div>'+btn('Medizin verbessern (500 €)','upgradeFacility("medical",500)')+'</div></div></div>')}
function ensureCareers(){if(!S)return;for(let p of S.players){if(p.contractUntil==null)p.contractUntil=S.week+26;if(p.injuredUntil==null)p.injuredUntil=0;if(p.potential==null)p.potential=Math.max(p.skill,rand(60,90));if(!p.careerGoal)p.careerGoal=pick(['Stammplatz','Sportliche Entwicklung','Mehr Eiszeit','Aufstieg']);if(p.ageProgress==null)p.ageProgress=0}}
function weeklyCareers(){ensureCareers();for(let p of [...S.players]){if(p.injuredUntil===S.week)log(p.name+' ist nach seiner Verletzung wieder einsatzfähig.');if(p.contractUntil<=S.week){S.players=S.players.filter(x=>x.id!==p.id);log('Vertrag von '+p.name+' ist ausgelaufen. Spieler verlässt den Kader.');continue}if(p.contractUntil-S.week===4)log('Vertrag von '+p.name+' endet in vier Wochen.');if(Math.random()<.07&&p.injuredUntil<=S.week){p.injuredUntil=S.week+rand(1,4);log(p.name+' fällt verletzt bis Woche '+p.injuredUntil+' aus.')}if(Math.random()<.13&&p.skill<p.potential)p.skill++;if(Math.random()<.12)p.morale=Math.max(0,p.morale-rand(1,4));p.ageProgress++;if(p.ageProgress>=52){p.age++;p.ageProgress=0;if(p.age>=34&&Math.random()<.35)p.skill=Math.max(20,p.skill-1)}}ensureDevelopment();if(S.youth.founded){for(let y of S.youth.players){if(S.week%52===0)y.age++;}}}
function promoteYouth(i){ensureDevelopment();let y=S.youth.players[i];if(!y||y.age<17)return;if(S.players.length>=30){msg('Kader voll','Maximal 30 Spieler.');return}confirmAction('Nachwuchstalent hochziehen',y.name+' wird ohne Ablöse in den Kader aufgenommen und erhält einen 26-Wochen-Vertrag.',()=>{S.players.push({id:++seq,name:y.name,age:y.age,pos:y.pos,skill:y.skill,morale:75,fitness:95,wage:0,status:'Aktiv',contractUntil:S.week+26,injuredUntil:0,potential:y.potential,careerGoal:'Sportliche Entwicklung',ageProgress:0});S.youth.players.splice(i,1);log(y.name+' steigt in die Kampfmannschaft auf.');save()})}

function scanTransfers(){act('Spielermarkt',()=>{S.transferMarket=Array.from({length:5},()=>{let p=freshPlayer();p.wage=rand(80,380);return p});log('Fünf Spieler auf dem regionalen Spielermarkt gefunden.')})}
function transferTalk(id){let x=S.transferMarket.find(p=>p.id===id);if(!x)return;dialogue('Wechselgespräch: '+x.name,'„Ein Wechsel zu euch ist möglich. Ich erwarte '+euro(x.wage)+' Aufwandsersatz für die Saison.“',[
['Saisonvereinbarung abschließen',()=>{if(!cash(-x.wage,'Spielerwechsel: '+x.name))return;S.players.push({...x,status:'Aktiv',contractUntil:S.week+26,injuredUntil:0,potential:Math.max(x.skill,rand(60,92)),careerGoal:pick(['Stammplatz','Sportliche Entwicklung','Mehr Eiszeit','Aufstieg'])});S.transferMarket=S.transferMarket.filter(p=>p.id!==id);log(x.name+' wechselt zu den Mangei.');close();save()}],
['Geringeren Aufwandsersatz anbieten',()=>{if(Math.random()<.45){x.wage=Math.max(0,x.wage-40);log(x.name+' akzeptiert eine niedrigere Forderung.')}else log(x.name+' bleibt bei seiner Forderung.');close();save()}],
['Gespräch vertagen',close]])}
function upgradeFacility(key,cost){ensureDevelopment();confirmAction('Infrastruktur verbessern','Diese Verbesserung kostet einmalig '+euro(cost)+'.',()=>{if(!cash(-cost,'Infrastruktur: '+key))return;S.facilities[key]++;log('Infrastruktur '+key+' verbessert.');save()})}

function ensureWorld(){if(!S.world)S.world={reputation:20,press:[],issues:[],relationships:{gemeinde:20,fans:25,sponsors:25,team:50},seasonTickets:0,newsWeek:0};return S.world}
function worldPage(){let w=ensureWorld();return '<div class="grid"><div>'+card('Vereinswelt & Entscheidungen','<p>Medien, Fans, Mannschaft und Geldgeber reagieren auf die Entwicklung des Vereins. Konflikte werden nicht automatisch für dich entschieden.</p><h3>Offene Angelegenheiten</h3>'+(w.issues.map((x,i)=>'<div class="line"><div><b>'+x.title+'</b><small>'+x.description+'</small></div>'+btn('Entscheiden','worldIssue('+i+')')+'</div>').join('')||'<p class="muted">Keine offenen Angelegenheiten.</p>')+'<h3>Lokale Vereinsmeldungen</h3>'+(w.press.slice(0,12).map(x=>'<div class="line"><div><b>Woche '+x.week+'</b><small>'+x.title+'</small></div></div>').join('')||'<p class="muted">Noch keine Medienmeldungen.</p>'))+'</div><div>'+card('Stimmung & Beziehungen',Object.entries(w.relationships).map(([k,v])=>'<div class="line"><span>'+({gemeinde:'Gemeinde',fans:'Fans',sponsors:'Sponsoren',team:'Mannschaft'}[k])+'</span><b>'+v+'/100</b></div>'+bar(v)).join('')+'<div class="line">Ansehen <b>'+w.reputation+'/100</b></div>'+bar(w.reputation))+card('Öffentlichkeitsarbeit','<p>Du kannst aktiv mit Fans und Medien kommunizieren. Die Wirkung hängt von der aktuellen Lage ab.</p><div class="actions">'+btn('Fanabend organisieren (100 €)','fanEvent()')+btn('Pressegespräch (0 €)','pressTalk()')+'</div>')+'</div></div>'}
function addWorldIssue(kind,title,description){let w=ensureWorld();if(w.issues.some(x=>x.kind===kind))return;w.issues.push({kind,title,description})}
function worldIssue(i){let w=ensureWorld(),x=w.issues[i];if(!x)return;let remove=()=>{w.issues.splice(i,1);save();close()};
if(x.kind==='player'){dialogue(x.title,'„Ich bin nicht zufrieden mit meiner Rolle. Ich würde gerne wissen, wie es weitergeht.“',[
['Ein persönliches Gespräch und klare Perspektive anbieten',()=>{w.relationships.team=Math.min(100,w.relationships.team+7);S.players.forEach(p=>p.morale=Math.min(100,p.morale+3));log('Spielergespräch: Stimmung verbessert.');remove()}],
['Situation unverändert lassen',()=>{w.relationships.team=Math.max(0,w.relationships.team-8);log('Spielerunzufriedenheit bleibt bestehen.');remove()}],
['Später entscheiden',close]])}
else if(x.kind==='sponsor'){dialogue(x.title,'„Wir möchten wissen, wie unsere Werbung beim Verein umgesetzt wird.“',[
['Kostenfreien Umsetzungsplan zusagen',()=>{w.relationships.sponsors=Math.min(100,w.relationships.sponsors+8);log('Sponsoren erhalten einen Werbeplan. Keine Bestellung ausgelöst.');remove()}],
['Werbemaßnahmen für 250 € beauftragen',()=>{if(!cash(-250,'Sponsorensichtbarkeit'))return;w.relationships.sponsors=Math.min(100,w.relationships.sponsors+14);log('Sponsorenwerbung beauftragt.');remove()}],
['Forderung zurückweisen',()=>{w.relationships.sponsors=Math.max(0,w.relationships.sponsors-12);log('Sponsorenbeziehung belastet.');remove()}],['Später entscheiden',close]])}
else if(x.kind==='finance'){dialogue(x.title,'„Die Vereinskasse ist knapp. Wie reagiert der Vorstand?“',[
['Ausgaben überprüfen und Sparplan ankündigen',()=>{w.reputation=Math.min(100,w.reputation+3);log('Sparplan angekündigt; bestehende Verträge bleiben unverändert.');remove()}],
['Mit Gemeinde über die Lage sprechen',()=>{w.relationships.gemeinde=Math.min(100,w.relationships.gemeinde+2);log('Finanzlage der Gemeinde erläutert. Keine Förderzusage.');remove()}],['Später entscheiden',close]])}
else if(x.kind==='fans'){dialogue(x.title,'„Wir wünschen uns mehr Informationen und Austausch mit dem Verein.“',[
['Offenen Fanabend ohne Bewirtung veranstalten (0 €)',()=>{w.relationships.fans=Math.min(100,w.relationships.fans+6);S.fan+=rand(1,4);log('Offener Fanabend durchgeführt.');remove()}],
['Aktuell keine Kapazität',()=>{w.relationships.fans=Math.max(0,w.relationships.fans-6);log('Fanwunsch vorerst abgelehnt.');remove()}],['Später entscheiden',close]])}}
function fanEvent(){confirmAction('Fanabend organisieren','Ein organisierter Fanabend kostet 100 €. Es gibt keine garantierten Einnahmen.',()=>{if(!cash(-100,'Fanabend'))return;let w=ensureWorld();w.relationships.fans=Math.min(100,w.relationships.fans+rand(7,14));S.fan+=rand(3,9);w.press.unshift({week:S.week,title:'Mangei laden zum Fanabend – Interesse in der Region wächst'});log('Fanabend durchgeführt.');save()})}
function pressTalk(){dialogue('Pressegespräch','„Was ist das wichtigste Ziel der Kirchdorf Mangei?“',[
['Finanziell stabil bleiben',()=>{let w=ensureWorld();w.reputation=Math.min(100,w.reputation+3);w.press.unshift({week:S.week,title:'Mangei setzen auf solide Vereinsfinanzen'});log('Pressegespräch zu Vereinsfinanzen.');close();save()}],
['Sportlich in der Liga wachsen',()=>{let w=ensureWorld();w.relationships.fans=Math.min(100,w.relationships.fans+4);w.press.unshift({week:S.week,title:'Mangei wollen sich sportlich etablieren'});log('Pressegespräch über sportliche Ziele.');close();save()}],
['Langfristig eine eigene Arena schaffen',()=>{let w=ensureWorld();w.press.unshift({week:S.week,title:'Kirchdorf Mangei sprechen über langfristigen Arenatraum'});log('Arena-Vision öffentlich angesprochen; keine Bauzusage.');close();save()}],
['Keine Aussage machen',close]])}
function weeklyWorld(){let w=ensureWorld();if(S.week%2===0){let topics=[['fans','Fans wünschen sich mehr Austausch','Die Anhänger möchten stärker eingebunden werden.'],['player','Unzufriedenheit im Kader','Einige Spieler fragen nach Perspektiven und Einsatzzeiten.'],['sponsor','Sponsoren wünschen Sichtbarkeit','Ein Werbepartner fragt nach der vereinbarten Präsenz.']];let available=topics.filter(t=>t[0]!=='sponsor'||S.sponsors.length);let t=pick(available);addWorldIssue(...t)}
if(S.cash<1000)addWorldIssue('finance','Finanzielle Engpässe','Die verfügbare Vereinskasse liegt unter 1.000 €.');
let headline=S.played.length&&S.played[S.played.length-1].week===S.week?'Kirchdorf Mangei bestreiten ein weiteres Eishockeyspiel':S.players.length>=16?'Mangei erreichen vollständige Kaderstärke':'Kirchdorf Mangei arbeiten weiter am Vereinsaufbau';
w.press.unshift({week:S.week,title:headline});w.press=w.press.slice(0,40);
if(w.issues.length>3)w.relationships.team=Math.max(0,w.relationships.team-2);
w.reputation=Math.max(0,Math.min(100,w.reputation+(S.players.length>=16?1:0)));
}
function finance(){return card('Finanzbuch','<div class="line">Verfügbare Kasse <b class="good">'+euro(S.cash)+'</b></div><div class="line">Vertragsvolumen Sponsoren <b>'+euro(S.sponsors.reduce((a,x)=>a+x.total,0))+'</b></div><div class="line">Noch offene Sponsorenraten <b>'+euro(S.sponsors.reduce((a,x)=>a+x.total-x.paid,0))+'</b></div><div class="line">Förderung bewilligt, noch nicht ausgezahlt <b>'+euro(S.municipality.grant)+'</b></div><h3>Alle Buchungen</h3><table><tr><th>Woche</th><th>Vorgang</th><th>Betrag</th></tr>'+S.ledger.map(x=>'<tr><td>'+x.week+'</td><td>'+x.title+'</td><td class="'+(x.amount<0?'bad':'good')+'">'+(x.amount>0?'+':'')+euro(x.amount)+'</td></tr>').join('')+'</table>')}
function nextWeek(){confirmAction('Woche '+(S.week+1)+' simulieren','Alle laufenden Anfragen, bereits vereinbarten Zahlungspläne und angesetzten Spiele entwickeln sich weiter. Es werden keine neuen Vereinsmaßnahmen ohne dich beschlossen.',()=>{S.week++;S.actions=0;weeklyCareers();S.players.forEach(p=>p.fitness=Math.min(100,p.fitness+rand(5,12)));ensureDevelopment();let weekly=S.staff.reduce((a,x)=>a+x.weekly,0)+(S.youth.founded?35:0);if(weekly>0){if(S.cash>=weekly){cash(-weekly,'Laufende Personal- und Nachwuchskosten');log('Wöchentliche Betriebskosten bezahlt: '+euro(weekly)+'.')}else{log('WARNUNG: Laufende Kosten '+euro(weekly)+' konnten nicht bezahlt werden.');S.staff.forEach(x=>x.quality=Math.max(0,x.quality-1));}}if(S.staff.some(x=>x.role==='Cheftrainer'))S.chem=Math.min(100,S.chem+2);if(S.staff.some(x=>x.role==='Physiotherapeut'))S.players.forEach(p=>p.fitness=Math.min(100,p.fitness+4));if(S.youth.founded)S.youth.players.forEach(x=>{if(Math.random()<.3)x.skill=Math.min(x.potential,x.skill+1)});for(const r of [...S.requests]){if(r.ready>S.week)continue;S.requests=S.requests.filter(x=>x.id!==r.id);if(r.type==='ice'){S.pending.push({kind:'ice',title:'Eiszeitenangebot St. Johann',desc:'Vier Trainingsstunden donnerstags 21:00–22:00 Uhr, 160 € je Stunde. Buchung nur nach Zustimmung.',price:160,venue:'St. Johann'})}else if(r.type==='sponsor'){if(Math.random()<.8){let amount=rand(5,20)*100;S.pending.push({kind:'sponsor',title:'Sponsorenangebot '+r.payload.name,desc:'Saisonbeitrag '+euro(amount)+'. Logo auf Trikot oder Vereinsmedien; erste Rate ca. 60 %, zweite später. Zahlung nach Vertragsabschluss nicht sofort garantiert.',name:r.payload.name,total:amount})}else log(r.payload.name+' lehnt Sponsoring derzeit ab.')}else if(r.type==='grant'){if(S.players.length>=8&&S.municipality.trust>=20&&Math.random()<.75){let amount=rand(5,18)*100;S.pending.push({kind:'grant',title:'Gemeinde: Förderangebot',desc:'Einmalige Anschubförderung '+euro(amount)+'. Nach Annahme folgt eine separate Auszahlung.',amount})}else{log('Gemeinde bittet um weiteren Nachweis von Kader und Trainingsbetrieb.');S.municipality.submitted=false}}else if(r.type==='opponent'){let o=pick(S.opponents);S.pending.push({kind:'opponent',title:'Testspielanfrage '+o.name,desc:'Auswärtsspiel in Woche '+(S.week+2)+'. Keine garantierten Einnahmen; mögliche Fahrtkosten sind noch nicht kalkuliert.',name:o.name,power:o.power})}else if(r.type==='home'){S.pending.push({kind:'ice',title:'Heimspiel-Eisangebot',desc:'Vier Stunden Eiszeit zu 220 € pro Stunde. Noch keine Spielorganisation.',price:220,venue:'St. Johann'})}}
for(let x of S.sponsors){if(!x.firstPaid&&S.week>=x.firstWeek){x.firstPaid=true;x.paid+=x.first;cash(x.first,'Sponsoring '+x.name+' – erste Rate');log(x.name+' überweist '+euro(x.first)+'.')}if(!x.secondPaid&&S.week>=x.secondWeek){x.secondPaid=true;x.paid+=x.second;cash(x.second,'Sponsoring '+x.name+' – zweite Rate');log(x.name+' überweist '+euro(x.second)+'.')}}
if(S.municipality.grant&&Math.random()<.45){cash(S.municipality.grant,'Gemeindeförderung');log('Gemeindeförderung über '+euro(S.municipality.grant)+' eingegangen.');S.municipality.grant=0}
ensureLeagueFields();if(S.league&&S.league.otherFixtures){for(const f of S.league.otherFixtures.filter(x=>x.week<=S.week)){let a=S.opponents.find(x=>x.name===f.a).power,b=S.opponents.find(x=>x.name===f.b).power;let ga=Math.max(0,rand(0,5)+Math.round((a-b)/15)),gb=Math.max(0,rand(0,5)+Math.round((b-a)/15));updateStanding(f.a,f.b,ga,gb)}S.league.otherFixtures=S.league.otherFixtures.filter(x=>x.week>S.week)}for(const f of [...S.fixtures])if(f.week<=S.week){S.fixtures=S.fixtures.filter(x=>x!==f);simulateMatch(f)}
if(S.arenaProject&&S.arenaProject.stage===4){let a=S.arenaProject;a.buildWeeks++;if(a.buildWeeks===5)log('Arena-Bau: Weitere Bauzahlungen benötigen eine gesonderte Genehmigung.')}weeklyWorld();log('Woche '+S.week+' abgeschlossen. '+S.pending.length+' offene Rückmeldungen.');save();render()})}
function exportSave(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='kirchdorf-mangei-spielstand.json';a.click();URL.revokeObjectURL(a.href)}
function importSave(){let input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=()=>{let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(!obj.ledger||!obj.players||!obj.week)throw Error();S=obj;seq=nextSequence(S);migrateSave();save();render()}catch(e){msg('Fehler','Ungültiger Spielstand.')}};reader.readAsText(input.files[0])};input.click()}
function resetGame(){confirmAction('Neues Spiel?','Der aktuelle Spielstand wird überschrieben. Exportiere ihn vorher, wenn du ihn behalten möchtest.',()=>{S=null;localStorage.removeItem('mangei_v1');close();render()})}
load();if(S)migrateSave();render();
</script></body></html>
